---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
  settings.yaml: ""
  custom.css: ""
  custom.js: ""
  bookmarks.yaml: |
    - Developer:
        - Github:
            - abbr: GH
              href: https://github.com/
  services.yaml: |
    - My First Group:
      - My First Service:
          href: http://localhost/
          description: Homepage is awesome
      - Monitorowanie:
        - Grafana:
            icon: grafana.png
            href: http://monitoring.homelab  # Adres Twojej Grafany
            description: Wizualizacja danych i metryki
            # Opcjonalna integracja (pokazuje np. statusy alertów na kafelku)
            # widget:
            #   type: grafana
            #   url: http://192.168.1.100:3000
            #   username: admin              # Twój login (lub użyj klucza API/Tokenu)
            #   password: twoje_haslo        # Twoje hasło

      - Home Assistant:
          icon: home-assistant.png             # Możesz zmienić na inną ikonę, np. linux.png lub docker.png
          href: http://ha.homelab  # Adres Twojego panelu Homelab
          description: Zarządzanie infrastrukturą domową

  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - resources:
        backend: resources
        expanded: true
        cpu: true
        memory: true
        network: default
    - search:
        provider: duckduckgo
        target: _blank
  docker.yaml: ""
